<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>知微之家 · 图片交互验收</title><link rel="stylesheet" href="/vendor/photostack/photo-stack.css"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,"PingFang SC",sans-serif;color:#513b47}body{background:linear-gradient(145deg,#eee0e5,#e9e3ef)}header{padding:calc(env(safe-area-inset-top) + 16px) 16px 18px;text-align:center;background:#ffffff70;backdrop-filter:blur(14px)}header small{display:block;color:#846d7b}main{max-width:500px;margin:30px auto;padding:0 20px}.row{display:flex;gap:12px}.avatar{width:38px;height:38px;border-radius:50%;background:#b98fa4;display:grid;place-items:center;color:#fff;flex:none}.bubble{padding:15px 24px 15px 15px;border-radius:20px;background:#ffffffa8;box-shadow:0 10px 30px #66445516}.bubble p{font-size:13px;margin:0 0 15px}.info{font-size:12px;line-height:1.8;margin-top:36px;color:#796471}.stack{margin:0 22px 8px 10px}dialog#viewer{position:fixed;inset:0;display:none;flex-direction:column;box-sizing:border-box;width:100%;max-width:none;height:100dvh;max-height:100dvh;margin:0;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px);border:0;border-radius:0;background:#241e28;color:#fff}dialog#viewer[open]{display:flex}.toolbar{display:flex;flex-wrap:wrap;gap:8px;flex:none}.toolbar button,.toolbar a{min-height:44px;min-width:44px;padding:8px 12px;border:1px solid #ffffff55;border-radius:12px;background:#ffffff22;color:#fff;font:inherit;font-size:13px;text-decoration:none}.toolbar button:disabled{opacity:.35}#counter{font-size:12px;margin:10px 0;color:#ddd}.canvas{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto}.canvas img{display:block;max-width:100%;max-height:100%;object-fit:contain}.caption{font-size:11px;margin-top:10px}.expanded-grid{display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:min(260px,70vw);margin:12px 0}.expanded-grid img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;cursor:pointer}.expanded-grid[aria-hidden="false"]{display:grid}.collapse{display:none;margin-top:8px;border:0;border-radius:9px;background:#c9a9b9;color:#493541;padding:8px 14px;font:inherit;font-size:12px}.collapse.visible{display:block}.stack[hidden]{display:none!important}</style></head><body><header><strong>知微</strong><small>滑动图片 · 独立测试环境 · v1</small></header><main><div class="row"><div class="avatar">微</div><div class="bubble"><p>这几张照片，想给你看看。</p><div id="stack" class="stack" tabindex="0" aria-label="滑动浏览照片"></div><div id="expanded" class="expanded-grid" aria-hidden="true"></div><button id="collapse" class="collapse" type="button">收起照片</button></div></div><p class="info">左右滑动堆叠照片，点击照片堆展开一排缩略图，再点单张进入大图。页面只用演示图片，不连接知微的聊天、记忆或后端。<br>原版 PhotoStack：Wren036 · PolyForm Noncommercial 1.0.0</p></main><dialog id="viewer" aria-label="图片预览"><div class="toolbar"><button id="close">× 关闭</button><button id="prev">‹</button><button id="next">›</button><button id="minus">−</button><button id="plus">＋</button><a id="save" download="preview.svg">保存原图</a></div><p id="counter"></p><div class="canvas"><img id="full" alt="演示图片"></div></dialog><script src="/vendor/photostack/photo-stack.js"></script><script>
const palettes=[['#dfbdcc','#855a77'],['#b4c9d8','#496e8b'],['#c2d5c6','#547963'],['#ead2a9','#a47b42']];const urls=palettes.map(([a,b],i)=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="'+a+'"/><stop offset="1" stop-color="'+b+'"/></linearGradient></defs><rect width="900" height="1200" fill="url(#g)"/><circle cx="450" cy="450" r="220" fill="#ffffff55"/><text x="450" y="500" text-anchor="middle" font-size="180" fill="#fff">'+(i+1)+'</text><text x="450" y="950" text-anchor="middle" font-size="42" fill="#fff">知微 · 图片预览</text></svg>'));let selected=0,scale=1;const viewer=document.getElementById('viewer'),full=document.getElementById('full');function paint(){scale=1;full.style.width='100%';full.style.maxHeight='100%';full.src=urls[selected];document.getElementById('counter').textContent=(selected+1)+' / '+urls.length;document.getElementById('save').href=urls[selected];document.getElementById('prev').disabled=selected===0;document.getElementById('next').disabled=selected===urls.length-1}function open(i){selected=i;paint();viewer.showModal()}document.getElementById('close').onclick=()=>viewer.close();document.getElementById('prev').onclick=()=>{if(selected>0){selected--;paint()}};document.getElementById('next').onclick=()=>{if(selected<urls.length-1){selected++;paint()}};function zoom(delta){scale=Math.max(1,Math.min(4,scale+delta));full.style.width=(scale*100)+'%';full.style.maxHeight=scale>1?'none':'100%'}document.getElementById('minus').onclick=()=>zoom(-.5);document.getElementById('plus').onclick=()=>zoom(.5);const expanded=document.getElementById('expanded'),stage=document.getElementById('stack'),collapse=document.getElementById('collapse');function expand(){expanded.replaceChildren();urls.forEach((src,i)=>{const image=document.createElement('img');image.src=src;image.alt='第'+(i+1)+'张照片';image.tabIndex=0;image.onclick=()=>open(i);image.onkeydown=e=>{if(e.key==='Enter')open(i)};expanded.appendChild(image)});stage.hidden=true;expanded.setAttribute('aria-hidden','false');collapse.classList.add('visible')}collapse.onclick=()=>{stage.hidden=false;expanded.setAttribute('aria-hidden','true');collapse.classList.remove('visible')};const stack=new PhotoStack('#stack',urls,{onTap:expand});document.getElementById('stack').addEventListener('keydown',e=>{if(e.key==='ArrowLeft')stack.prev();if(e.key==='ArrowRight')stack.next();if(e.key==='Enter')expand()});
</script></body></html>
