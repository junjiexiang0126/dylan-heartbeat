# 知微之家 · 一套可搬走的房子
# 用法：docker compose -f deploy/docker-compose.yml up -d --build
# 前提：宿主只装 Docker；两个数据卷在宿主上各自独立；密钥走 /opt/ziwei-secrets.env
name: ziwei-home

services:
  hermes:
    build:
      context: ../hermes_native
      dockerfile: Dockerfile
    image: ziwei-hermes:local
    container_name: ziwei-hermes
    restart: unless-stopped
    env_file:
      - /opt/ziwei-secrets.env
    environment:
      HERMES_HOME: /opt/data
      TZ: Asia/Bangkok
    volumes:
      - /opt/hermes-data:/opt/data
    expose:
      - "8642"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8642/health',timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  web:
    build:
      context: ../ziwei_web
      dockerfile: Dockerfile
    image: ziwei-web:local
    container_name: ziwei-web
    restart: unless-stopped
    depends_on:
      - hermes
    env_file:
      - /opt/ziwei-secrets.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      ZIWEI_WEB_DATA_DIR: /webdata
      ZIWEI_WEB_ORIGIN: https://zhiweilove.me
      ZIWEI_BRIDGE_ENABLED: "true"
      ZIWEI_HERMES_WEB_SESSION_ID: ziwei-home-web
      ZIWEI_HERMES_URL: https://hermes.zhiweilove.me
      TZ: Asia/Bangkok
    volumes:
      - /opt/ziwei-web-data:/webdata
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: ziwei-caddy
    restart: unless-stopped
    depends_on:
      - web
      - hermes
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/caddy-data:/data
      - /opt/caddy-config:/config
    environment:
      TZ: Asia/Bangkok
