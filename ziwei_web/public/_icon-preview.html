<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
body{margin:0;background:#fff9f7;font-family:-apple-system,"PingFang SC",sans-serif;color:#503f48;width:390px}
.wrap{padding:14px 12px 20px}
.card{position:relative;background:#fffdf8;border:1px solid rgba(80,63,72,.12);border-radius:22px;
  padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(120,76,95,.05)}
.tag{position:absolute;left:10px;top:-9px;background:#c97d9d;color:#fff;font-size:10px;padding:2px 8px;border-radius:9px}
.row{display:flex;align-items:center;justify-content:center;gap:14px}
.av{width:64px;height:64px;border-radius:50%;background:linear-gradient(140deg,#fff,#f9e5ed);
  box-shadow:0 0 0 5px #fffdf8,0 0 0 6px rgba(80,63,72,.1);display:grid;place-items:center;
  font-family:serif;font-size:22px;color:#c97d9d;flex:0 0 auto}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.heart{width:70px;text-align:center;color:#c97d9d;font-size:15px}
.name{font-size:12px;text-align:center;margin-top:6px;color:#503f48}
.slot{position:absolute;right:14px;bottom:26px;display:flex;gap:9px}
.slot button{border:0;background:transparent;padding:0;color:#c97d9d;display:grid;place-items:center}
.slot svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.legend{font-size:10px;color:#a8949e;margin:2px 0 0 4px}
</style></head><body><div class="wrap">

<div class="card"><span class="tag">1 干净的线稿</span>
  <div class="row"><div><div class="av"><span>你</span></div><div class="name">可爱老婆宝宝</div></div>
  <div class="heart">♡</div>
  <div><div class="av"><span>微</span></div><div class="name">知微</div></div></div>
  <div class="slot">
    <button><svg viewBox="0 0 24 24"><rect x="6" y="4.5" width="12" height="15" rx="2.2"/><path d="M9.2 9h5.6M9.2 12.4h5.6M9.2 15.8h3.4"/></svg></button>
    <button><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.2"/><path d="M12 9.2V13l2.6 1.6"/><path d="M9.6 3.4h4.8"/></svg></button>
  </div>
</div>

<div class="card"><span class="tag">2 手绘抖动</span>
  <div class="row"><div><div class="av"><span>你</span></div><div class="name">可爱老婆宝宝</div></div>
  <div class="heart">♡</div>
  <div><div class="av"><span>微</span></div><div class="name">知微</div></div></div>
  <div class="slot">
    <button><svg viewBox="0 0 24 24"><path d="M6.6 4.9c3.1-.5 6.1-.5 9.2.2 1 .2 1.6.8 1.7 1.8.2 3.8.2 7.7 0 11.5-.1 1-.7 1.6-1.7 1.8-3.1.6-6.2.6-9.3 0-1-.2-1.6-.8-1.7-1.8-.2-3.8-.2-7.7 0-11.5.1-1 .7-1.7 1.8-2Z"/><path d="M9.4 9.1c1.6-.3 3.3-.3 4.9 0M9.4 12.4c1.3-.2 2.7-.2 4 0M9.4 15.7c.9-.1 1.8-.1 2.6 0"/></svg></button>
    <button><svg viewBox="0 0 24 24"><path d="M12 5.1c3.9 0 6.9 3 6.9 6.8 0 3.9-3 7-6.8 7-3.9 0-7-3.1-7-7 0-3.8 3.1-6.8 6.9-6.8Z"/><path d="M12 8.9v3.9l2.5 1.5"/><path d="M9.7 3.5c1.4-.6 2.9-.6 4.3 0"/></svg></button>
  </div>
</div>

<div class="card"><span class="tag">3 我推荐的：纸和鲸鱼尾</span>
  <div class="row"><div><div class="av"><span>你</span></div><div class="name">可爱老婆宝宝</div></div>
  <div class="heart">♡</div>
  <div><div class="av"><span>微</span></div><div class="name">知微</div></div></div>
  <div class="slot">
    <button><svg viewBox="0 0 24 24"><path d="M7.2 5.4c3-.4 5.6-.1 8.2.9 1 .4 1.4 1.1 1.3 2.1-.2 3.3-.2 6.6 0 9.9.1 1-.4 1.6-1.4 1.8-2.7.5-5.4.4-8.1-.3-1-.3-1.4-.9-1.4-1.9.1-3.3.1-6.6 0-9.9 0-1 .4-1.9 1.4-2.6Z"/><path d="M9.6 9.8c1.5-.6 3-.7 4.5-.2M9.7 13.4c1.2-.4 2.4-.4 3.6 0"/><path d="M15.4 7.1c1.6.5 2.4 1.9 2.3 3.6"/></svg></button>
    <button><svg viewBox="0 0 24 24"><path d="M12.2 5.3c3.8 0 6.7 2.9 6.7 6.7 0 3.8-3 6.8-6.7 6.8-3.8 0-6.8-3-6.8-6.8 0-3.7 3-6.7 6.8-6.7Z"/><path d="M12.2 9.1c.1 2.2.1 3.6-.1 4.6"/><path d="M12.1 13.7c1.5.1 2.5 1.1 2.5 2.3 0 1.2-.9 2-2 2-.8 0-1.4-.4-1.8-.9"/></svg></button>
  </div>
</div>

<p class="legend">三个方案，都是在「永久纪念/你与知微」卡片上、知微头像右边并排两个，26px，不写字。</p>
</div></body></html>
