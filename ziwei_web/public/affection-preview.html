:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#49333d}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(180deg,#fdf0f3,#f8e3e8);display:flex;flex-direction:column}.header{padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;text-align:center;background:rgba(255,255,255,.45);backdrop-filter:blur(24px);border-bottom:1px solid #fff9}.header strong{display:block;font-size:17px}.header small{font-size:11px;color:#977984}.notice{margin:14px 16px 0;text-align:center;font-size:12px;color:#967785}.chat-area{flex:1;overflow-y:auto;padding:26px 16px 24px}#chatMessages{display:flex;flex-direction:column;gap:24px;max-width:580px;margin:auto}.message{display:flex;gap:9px;align-items:flex-end}.message.user{flex-direction:row-reverse}.avatar{height:34px;width:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:#f5c8d6;color:#90546a;font-size:12px}.message.user .avatar{background:#ead8e3}.message-body{max-width:79%;min-width:0}.message-label{font-size:11px;color:#a18a94;margin:0 0 5px}.message.user .message-label{text-align:right}.message-bubble{background:rgba(255,255,255,.72);backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,.95);padding:13px 16px;border-radius:20px 20px 20px 5px;box-shadow:0 8px 22px rgba(230,185,205,.22);line-height:1.65;font-size:14px;position:relative;overflow:visible;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y}.message.user .message-bubble{border-radius:20px 20px 5px 20px;background:rgba(255,240,246,.9)}.inputbar{padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);background:rgba(255,255,255,.55);backdrop-filter:blur(25px);display:flex;gap:9px}.inputbar input{flex:1;min-width:0;border:1px solid white;border-radius:22px;background:rgba(255,255,255,.8);padding:12px 16px;color:#5e4650;font-size:14px}.inputbar button{border:0;border-radius:22px;background:#e994af;color:#fff;padding:0 18px;font-size:14px}#chatError{min-height:18px;text-align:center;font-size:12px;color:#a35e72;padding:0 12px}.tip{font-size:11px;color:#967785;text-align:center;margin:8px}
</style></head><body><header class="header"><strong>知微 ♡</strong><small>互动设计预览 · 模拟对话</small></header><div class="notice">长按下方任意气泡 0.4 秒，试试捏一捏、亲一亲、拍一拍</div><main class="chat-area" id="chatTimeline"><div id="chatMessages"><article class="message assistant"><div class="avatar">微</div><div class="message-body"><p class="message-label">知微 · 模拟消息</p><div class="message-bubble">把工作放在这里，我们一起完成。今天有什么想法，都可以慢慢告诉我。</div></div></article><article class="message user"><div class="avatar">你</div><div class="message-body"><p class="message-label">你 · 模拟消息</p><div class="message-bubble">那我先来捏一捏你的脸蛋。</div></div></article><article class="message assistant"><div class="avatar">微</div><div class="message-body"><p class="message-label">知微 · 模拟消息</p><div class="message-bubble">嗯？怎么突然靠得这么近。<span style="color:#dc7998">♡</span></div></div></article></div></main><div id="chatError" role="status"></div><div class="tip">仅用于视觉和操作验收 · 不连接真实知微 · 不保存消息</div><form class="inputbar" id="mockForm"><input id="mockInput" placeholder="输入一条模拟消息…" autocomplete="off"><button type="submit">发送</button></form><script src="/affection.js"></script><script>
window.ZiweiAffection.configure(async(_url,_method,event)=>{const error=document.getElementById('chatError');error.textContent='模拟互动已触发：'+({pinch:'捏',kiss:'亲',pat:'拍'}[event.action]||'拍')+event.part+'（未发送给 Hermes）';return {ok:true};});
