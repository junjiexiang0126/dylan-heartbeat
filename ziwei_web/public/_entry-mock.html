<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
body{margin:0;background:#efe3dd;width:390px;font-family:-apple-system,sans-serif;color:#3f3038}
.wrap{padding:14px 12px}
.card{background:#fff9f7;border:1px solid rgba(60,40,50,.18);border-radius:20px;padding:16px 14px;margin-bottom:14px}
.tag{display:inline-block;background:#b4496b;color:#fff;font-size:9px;padding:2px 7px;border-radius:8px;margin-bottom:10px}
.rowline{display:flex;align-items:center;justify-content:center;gap:14px}
.av{width:58px;height:58px;border-radius:50%;background:linear-gradient(140deg,#fff,#f9e5ed);
    box-shadow:0 0 0 5px #fff9f7,0 0 0 6px rgba(80,63,72,.10);display:grid;place-items:center;
    font-family:serif;font-size:20px;color:#c97d9d}
.name{font-size:11px;text-align:center;margin-top:5px}
.heart{color:#c97d9d;font-size:14px}
.entries{display:flex;gap:12px;justify-content:center;margin-top:14px}
.entries img{border-radius:16px;box-shadow:0 2px 6px rgba(90,50,70,.14);display:block}
.a img{width:88px;height:88px}
.b img{width:56px;height:56px}
.beside{position:relative}
.beside .entries{position:absolute;right:-6px;bottom:-4px;margin:0;gap:6px}
.cap{font-size:9px;color:#6b5560;margin-top:8px;text-align:center}
</style></head><body><div class="wrap">

<div class="card"><span class="tag">A　88px，并排放在卡片下方</span>
 <div class="rowline"><div><div class="av">你</div><div class="name">宝宝</div></div>
  <div class="heart">♡</div>
  <div><div class="av">微</div><div class="name">知微</div></div></div>
 <div class="entries a"><img src="icon-note.png" alt=""><img src="icon-journal.png" alt=""></div>
 <div class="cap">两个入口用你给的插画，方形圆角，不写字</div>
</div>

<div class="card"><span class="tag">B　56px，塞在知微头像右侧</span>
 <div class="rowline"><div><div class="av">你</div><div class="name">宝宝</div></div>
  <div class="heart">♡</div>
  <div class="beside"><div class="av">微</div><div class="name">知微</div>
   <div class="entries b"><img src="icon-note.png" alt=""><img src="icon-journal.png" alt=""></div></div></div>
 <div class="cap">挤在头像边上，两个加起来约 118px 宽</div>
</div>

</div></body></html>
