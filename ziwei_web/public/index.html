<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f4ee"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/style.css"><title>知微</title></head><body><main class="shell"><header><strong>知微</strong><span id="status">独立前端 · 第一阶段</span></header><section id="login" class="login"><h1>欢迎回来</h1><p>这里是你与知微的私人空间。</p><form id="loginForm"><label for="password">访问密码</label><input id="password" type="password" autocomplete="current-password" required><button>进入</button></form><p id="loginError" role="alert"></p></section><section id="app" hidden><div class="panel" id="chat"><div class="empty"><h2>聊天</h2><p>聊天界面已经就位。真实 Hermes 连接将在安全桥接验收后启用。</p><small>不会伪造知微的回复。</small></div><div class="composer"><input disabled placeholder="等待安全接入完成…"><button disabled>发送</button></div></div><div class="panel" id="memory" hidden><h2>记忆</h2><p>仅显示 Hermes 原有记忆；当前未接入，不展示虚构内容。</p></div><div class="panel" id="logs" hidden><h2>日志</h2><p>自主简报与记忆审计将从服务器读取；当前未接入。</p></div><nav aria-label="页面导航"><button data-tab="chat" class="active">聊天</button><button data-tab="memory">记忆</button><button data-tab="logs">日志</button></nav><button class="logout" id="logout">退出登录</button></section></main><script src="/app.js" defer></script></body></html>
