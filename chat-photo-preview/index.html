<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>知微之家 · PR89 图片验收</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/chat.css"><link rel="stylesheet" href="/work.css"><link rel="stylesheet" href="/vendor/photostack/photo-stack.css"><link rel="stylesheet" href="/chat-photo.css"><style>html,body{min-height:100%;margin:0}body{background:linear-gradient(150deg,#e6d9df,#dddce7);font-family:-apple-system,"PingFang SC",sans-serif}.preview-top{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 12px) 15px 14px;background:#ffffffb3;backdrop-filter:blur(18px);text-align:center}.preview-top small{display:block;font-size:11px;opacity:.65}.tabs{display:flex;justify-content:center;gap:10px;margin:15px}.tabs button{padding:10px 26px;border-radius:20px;border:1px solid #fff8;background:#ffffffb8}.tabs button[aria-selected=true]{background:#bba1b1;color:white}.preview-chat{max-width:520px;margin:0 auto;padding:12px 20px 100px}.message{display:flex;gap:10px;margin:15px 0;align-items:flex-start}.message-avatar{height:36px;width:36px;flex:none;border-radius:50%;background:#bda6b6;display:grid;place-items:center;color:#fff}.message-body{min-width:0;max-width:calc(100% - 46px)}.message-label{font-size:11px;opacity:.6;margin:0 0 7px}.message-bubble{padding:12px 14px;border-radius:16px;background:#ffffff91;backdrop-filter:blur(12px)}.message.user{flex-direction:row-reverse}.message.user .message-label{text-align:right}.message-content{font-size:14px}.hint{margin:15px 20px;font-size:12px;color:#675667;text-align:center}#chatImageViewer{padding:0!important}#chatImageViewer .viewer-toolbar,#chatImageViewer header,#chatImageViewer footer,#chatImageViewer button,#chatImageViewer a,#chatImageViewer p{display:none!important}</style></head><body><div class="preview-top"><strong>知微之家 · 图片交互验收</strong><small>基于 main 的聊天样式 · 模拟数据 · PR #89</small></div><div class="tabs"><button id="privateTab" aria-selected="true">知微私聊</button><button id="workTab" aria-selected="false">Work 群聊</button></div><div class="hint">单图双击全屏，多图左右滑动、单击展开；长按图片尝试系统保存。</div><section id="chat"><div id="chatMessages" class="preview-chat"></div></section><section id="work" hidden><div class="work-conversation preview-chat"></div></section><dialog id="chatImageViewer"><div class="viewer-toolbar"><button id="chatImageClose">关闭</button><button id="chatImagePrevious">上一张</button><button id="chatImageNext">下一张</button><button id="chatImageZoomIn">+</button><button id="chatImageZoomOut">-</button><a id="chatImageSave">保存</a></div><span id="chatImageName"></span><div id="chatImageCanvas"><img id="chatImageFull" alt="全屏图片"></div><button id="chatImageRetry" hidden>重试</button></dialog><script src="/vendor/photostack/photo-stack.js"></script><script>const photo=i=>'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960"><rect width="720" height="960" fill="'+['#c8a5b7','#b0c5d6','#b7cfb6','#e6c8a0'][i%4]+'"/><circle cx="360" cy="420" r="170" fill="#ffffff66"/><text x="360" y="470" text-anchor="middle" font-size="160" fill="white">'+(i+1)+'</text></svg>');function message(root,name,text,count){const line=document.createElement('article');line.className='message assistant';const avatar=document.createElement('div');avatar.className='message-avatar';avatar.textContent=name[0];const body=document.createElement('div');body.className='message-body';const label=document.createElement('p');label.className='message-label';label.textContent=name+' · 现在';const bubble=document.createElement('div');bubble.className='message-bubble glass';const content=document.createElement('div');content.className='message-content';content.textContent=text;bubble.append(content);for(let i=0;i<count;i++){const img=document.createElement('img');img.className='message-media';img.src=photo(i);img.alt='测试图片 '+(i+1);bubble.append(img)}body.append(label,bubble);line.append(avatar,body);root.append(line)}for(const [root,name] of [[document.querySelector('#chatMessages'),'知微'],[document.querySelector('#work .work-conversation'),'知微']]){message(root,name,'这是普通文字消息，应该保留毛玻璃气泡。',0);message(root,name,'',1);message(root,name,'',4);message(root,name,'这段文字与图片属于同一条消息。',3)}document.querySelector('#privateTab').onclick=()=>{document.querySelector('#chat').hidden=false;document.querySelector('#work').hidden=true;document.querySelector('#privateTab').setAttribute('aria-selected','true');document.querySelector('#workTab').setAttribute('aria-selected','false')};document.querySelector('#workTab').onclick=()=>{document.querySelector('#chat').hidden=true;document.querySelector('#work').hidden=false;document.querySelector('#workTab').setAttribute('aria-selected','true');document.querySelector('#privateTab').setAttribute('aria-selected','false')};window.ZiweiChatExtra={showImage(img){const body=img.closest('.message-body');const imgs=[...body.querySelectorAll('.zw-photo-original')];window.photos=imgs.map(i=>i.src);window.index=Math.max(0,imgs.indexOf(img));paint();document.querySelector('#chatImageViewer').showModal()}};function paint(){document.querySelector('#chatImageFull').src=window.photos[window.index]}document.querySelector('#chatImageViewer').addEventListener('click',e=>{if(e.target.id==='chatImageViewer'||e.target.id==='chatImageCanvas')e.currentTarget.close()});let x=0,y=0;document.querySelector('#chatImageCanvas').addEventListener('touchstart',e=>{x=e.touches[0].clientX;y=e.touches[0].clientY},{passive:true});document.querySelector('#chatImageCanvas').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4){window.index=Math.max(0,Math.min(window.photos.length-1,window.index+(dx<0?1:-1)));paint()}},{passive:true});</script><script src="/chat-photo.js"></script></body></html>
