name: Ziwei Web isolated tests
on:
  push:
    branches:
      - feature/ziwei-pwa-phase1-foundation
  pull_request:
    paths:
      - 'ziwei_web/**'
      - '.github/workflows/ziwei-web-tests.yml'
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ziwei_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
