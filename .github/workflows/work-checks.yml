name: Work isolated checks
on:
  pull_request:
    paths:
      - 'ziwei_web/**'
      - '.github/workflows/work-checks.yml'
      - 'hermes_native/work*.py'
  workflow_dispatch:
jobs:
  work:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ziwei_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: node --check work_service.js && node --check public/work.js && node --check server.js
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm run test:work
      - run: python3 -m unittest discover -s ../hermes_native/tests -p test_work_agent.py
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test e2e/work-studio.spec.js e2e/chat-minimal.spec.js e2e/chat-profiles.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: work-browser-evidence
          path: ziwei_web/test-results/
          retention-days: 7
