name: Work isolated checks
on:
  pull_request:
    paths:
      - 'ziwei_web/**'
      - '.github/workflows/work-checks.yml'
  workflow_dispatch:
jobs:
  work:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ziwei_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: node --check work_service.js && node --check public/work.js && node --check server.js
      - run: node --test tests/work-phase1.test.cjs tests/work-service.test.cjs
