name: Official Hermes preparation
on:
  push:
    branches: [feature/ziwei-hermes-native-v1, fix/ziwei-native-backup-profile-v1]
    paths: [hermes_native/**, .github/workflows/hermes-native.yml]
  pull_request:
    branches: [feature/ziwei-hermes-native-v1]
    paths: [hermes_native/**, .github/workflows/hermes-native.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Public test-only values. No model calls are made.
      DEEPSEEK_API_KEY: startup-check-only-no-model-request
      API_SERVER_KEY: startup-check-only-distinct-not-a-live-credential
      HERMES_HOME: /data/hermes_native
      HERMES_WRITE_SAFE_ROOT: /data/hermes_native/workspace
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated Python bootstrap safety tests
        run: python3 -m unittest discover -s hermes_native/tests -v
      - name: Build the thin configuration layer on the exact official stable image
        run: docker build -f hermes_native/Dockerfile -t ziwei-native-preflight hermes_native
      - name: Start the actual official container and Gateway
        run: |
          docker volume create ziwei-native-preflight-data
          docker run --rm --entrypoint sh -v ziwei-native-preflight-data:/data \
            ziwei-native-preflight -c 'printf legacy-data-preserved > /data/legacy-marker'
          docker run -d --name ziwei-native-preflight -p 8642:8642 \
            -v ziwei-native-preflight-data:/data -e HERMES_HOME -e HERMES_WRITE_SAFE_ROOT \
            -e DEEPSEEK_API_KEY -e API_SERVER_KEY -e API_SERVER_ENABLED=true \
            -e API_SERVER_HOST=0.0.0.0 \
            ziwei-native-preflight
          python3 hermes_native/check_api.py
          docker exec ziwei-native-preflight python -c \
            'from pathlib import Path; from hermes_cli.config import load_config; assert Path("/data/legacy-marker").read_text() == "legacy-data-preserved"; assert load_config()["terminal"]["cwd"] == "/data/hermes_native/workspace"; Path("/data/hermes_native/workspace/restart-marker").write_text("persisted")'
          docker exec ziwei-native-preflight /opt/hermes/.venv/bin/python -c \
            'import sys; sys.path.insert(0,"/opt/ziwei-native"); import runtime_guard as g; g.validate_candidate(g.TREES / "baseline"); assert g.health()'
          docker exec ziwei-native-preflight /command/s6-svc -r /run/service/ziwei-gateway
          python3 hermes_native/check_api.py
          docker restart ziwei-native-preflight
          python3 hermes_native/check_api.py
          docker exec ziwei-native-preflight python -c \
            'from pathlib import Path; assert Path("/data/legacy-marker").read_text() == "legacy-data-preserved"; assert Path("/data/hermes_native/workspace/restart-marker").read_text() == "persisted"'
      - name: Show startup evidence and stop ephemeral container
        if: always()
        run: |
          docker logs --tail 120 ziwei-native-preflight || true
          docker rm -f ziwei-native-preflight || true
          docker volume rm ziwei-native-preflight-data || true
